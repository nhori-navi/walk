<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>徒歩ナビ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;font-size:15px}
#map{position:absolute;top:0;left:0;right:0;height:58%}
#panel{position:absolute;top:58%;bottom:0;left:0;right:0;overflow:auto;padding:8px 10px;background:#fafafa;border-top:1px solid #ccc}
@media (min-width:900px){
  #map{height:auto;bottom:0;right:380px}
  #panel{top:0;left:auto;width:380px;border-top:none;border-left:1px solid #ccc}
}
button,input{font-size:15px;padding:6px 10px;margin:3px 3px 3px 0}
input[type=checkbox]{padding:0;margin:0 4px 0 0}
#search{width:60%}
#rem{font-size:22px;font-weight:bold;margin:2px 0}
#sub{font-size:14px;color:#444;margin:2px 0 6px;line-height:1.6}
.hit{padding:8px;border-bottom:1px solid #ddd;cursor:pointer;background:#fff}
.small{color:#777;font-size:12px;margin:4px 0}
.fav{background:#fff3cd;border:1px solid #e0a800;border-radius:14px;padding:4px 12px}
details{margin:8px 0;background:#fff;border:1px solid #ddd;border-radius:6px;padding:6px}
.me{width:34px;height:34px;position:relative}
.me .dot{position:absolute;left:8px;top:8px;width:18px;height:18px;border-radius:50%;background:#1e90ff;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.me .arw{position:absolute;left:11px;top:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #1e90ff;display:none}
.lg{display:inline-block;width:14px;height:4px;vertical-align:middle;margin:0 2px 0 6px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="rem">目的地を設定してください</div>
  <div id="sub"></div>
  <div><input id="search" placeholder="目的地（駅名・施設名・住所）"><button id="searchBtn">検索</button></div>
  <div id="hits"></div>
  <div id="favBar"></div>
  <div><button id="pickBtn">地図で指定</button><button id="viaBtn">経由地を指定</button><button id="viaClear" disabled>経由地を消す</button></div>
  <div><button id="recalcBtn" disabled>再計算</button><button id="followBtn">追従：ON</button><button id="headBtn">向き：北が上</button><button id="favAdd" disabled>★登録</button></div>
  <div class="small"><label><input type="checkbox" id="cmpChk" checked>比較用にMapboxの徒歩ルートを表示（点線）</label></div>
  <div class="small"><label><input type="checkbox" id="netChk">道のデータを表示</label><br>
    <span class="lg" style="background:#8a9a9a"></span>通れる道<span class="lg" style="background:#f39c12"></span>階段<span class="lg" style="background:#9b59b6"></span>つながっていない道<span class="lg" style="background:#e74c3c"></span>通行不可の印</div>
  <div id="status" class="small">現在地を取得中…</div>
  <div id="err" class="small" style="color:#c00"></div>
  <details>
    <summary>お気に入りの管理</summary>
    <div id="favList"></div>
    <div class="small">端末間で移すとき：書き出し → 文字をコピー → 別の端末に貼って読み込み</div>
    <textarea id="favText" rows="3" style="width:100%"></textarea>
    <button id="favExport">書き出し</button><button id="favImport">読み込み</button>
  </details>
  <div class="small">道路・名称検索データ © OpenStreetMap contributors</div>
</div>
<script>
// ▼▼▼ トークン（車用ナビと同じもの） ▼▼▼
const TOKEN = 'pk.eyJ1IjoiaG9yaWhha28iLCJhIjoiY211djd0ejljMDA5ZjMycHYxaTY3M3BsdSJ9.a1yefJYynC4k_YvllM5DVw';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const MAX_M = 5000;   // 徒歩で計算する上限（直線距離）
const MARGIN = 500;   // 周りに取る余白（m）
const SPEED = 80;     // 分速80m
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const HW = '^(footway|path|pedestrian|steps|corridor|living_street|residential|service|unclassified|road|track|cycleway|tertiary|tertiary_link|secondary|secondary_link|primary|primary_link|trunk|trunk_link)$';
const NET_COLOR = {ok:'#8a9a9a', steps:'#f39c12', iso:'#9b59b6', ng:'#e74c3c'};

mapboxgl.accessToken = TOKEN;
const map = new mapboxgl.Map({
  container: 'map', style: 'mapbox://styles/mapbox/standard',
  center: [139.33, 35.62], zoom: 12, language: 'ja'
});
map.addControl(new mapboxgl.NavigationControl(), 'top-right');

const $ = id => document.getElementById(id);
let pos = null, posMarker = null, arw = null, dest = null, destMarker = null, destName = '', via = null, viaMarker = null;
let pickMode = null, follow = true, busy = false, pending = false;
let graph = null, route = null, cmpCoords = null, cmpText = '';
let headingUp = false, heading = null, hx = 0, hy = 0, lastCompass = 0, lastCam = 0;
const errs = [];
let favs = [];
try { favs = JSON.parse(localStorage.getItem('walk_favs') || '[]'); } catch (e) { favs = []; }

// ---------- 共通 ----------
function showErr(m) {
  const t = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  errs.unshift(t + ' ' + m); errs.length = Math.min(errs.length, 3);
  $('err').innerHTML = errs.map(x => `<div>${esc(x)}</div>`).join('');
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const status = m => { $('status').textContent = m; };
const pause = () => new Promise(r => setTimeout(r, 30));
function setData(id, f) { const s = map.getSource(id); if (s) s.setData({type:'FeatureCollection', features:f}); }
const line = c => [{type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:c}}];
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m / 10) * 10 + 'm'; }
const mins = m => Math.max(1, Math.round(m / SPEED));

// ---------- 距離の計算 ----------
function distM(a, b) {
  const r = Math.PI / 180, x = (b[0] - a[0]) * r * Math.cos((a[1] + b[1]) / 2 * r), y = (b[1] - a[1]) * r;
  return Math.sqrt(x * x + y * y) * 6371000;
}
function segDist(p, a, b) {
  const k = Math.cos(p[1] * Math.PI / 180) * 111320, m = 110540;
  const ax = (a[0] - p[0]) * k, ay = (a[1] - p[1]) * m, bx = (b[0] - p[0]) * k, by = (b[1] - p[1]) * m;
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L ? -(ax * dx + ay * dy) / L : 0; t = Math.max(0, Math.min(1, t));
  const x = ax + t * dx, y = ay + t * dy;
  return {d: Math.sqrt(x * x + y * y), t};
}
function nearest(coords, p) {
  let best = {d: 1e12, i: 0, t: 0};
  for (let i = 0; i < coords.length - 1; i++) {
    const s = segDist(p, coords[i], coords[i + 1]);
    if (s.d < best.d) best = {d: s.d, i, t: s.t};
  }
  return best;
}
function bboxOf(pts, m) {
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
  const s = Math.min(...lats), n = Math.max(...lats), w = Math.min(...lons), e = Math.max(...lons);
  const dLat = m / 110540, dLon = m / (111320 * Math.cos((s + n) / 2 * Math.PI / 180));
  return {s: s - dLat, n: n + dLat, w: w - dLon, e: e + dLon};
}
const inside = (a, b) => a.s >= b.s && a.n <= b.n && a.w >= b.w && a.e <= b.e;

// ---------- 地図の準備 ----------
map.on('load', () => {
  const empty = {type:'FeatureCollection', features:[]};
  ['net', 'cmp', 'route'].forEach(id => map.addSource(id, {type:'geojson', data:empty}));
  map.addLayer({id:'net', type:'line', source:'net', paint:{
    'line-color':['match', ['get', 'k'], 'steps', NET_COLOR.steps, 'iso', NET_COLOR.iso, 'ng', NET_COLOR.ng, NET_COLOR.ok],
    'line-width':['match', ['get', 'k'], 'steps', 5, 2], 'line-opacity':0.85}});
  map.addLayer({id:'cmp', type:'line', source:'cmp',
    paint:{'line-color':'#777', 'line-width':4, 'line-dasharray':[2, 1.5]}});
  map.addLayer({id:'routeCasing', type:'line', source:'route', layout:{'line-cap':'round', 'line-join':'round'},
    paint:{'line-color':'#fff', 'line-width':9}});
  map.addLayer({id:'route', type:'line', source:'route', layout:{'line-cap':'round', 'line-join':'round'},
    paint:{'line-color':'#1f6fd1', 'line-width':5}});
  if (route) setData('route', line(route.coords));
  if (cmpCoords) setData('cmp', line(cmpCoords));
  drawNet();
});
map.on('error', e => showErr('地図エラー：' + (e.error && e.error.message ? e.error.message : '不明')));
map.on('dragstart', () => setFollow(false));
map.on('rotatestart', e => { if (e.originalEvent) setFollow(false); });
map.on('click', e => {
  const p = [e.lngLat.lng, e.lngLat.lat];
  if (pickMode === 'dest') { pickMode = null; destName = ''; setDest(p); }
  else if (pickMode === 'via') { pickMode = null; setVia(p); }
});

// ---------- 追従と向き ----------
function setFollow(v) {
  follow = v; $('followBtn').textContent = follow ? '追従：ON' : '追従：OFF';
  if (v) cam();
}
function cam() {
  if (!follow || !pos) return;
  const o = {center: pos, duration: 600};
  if (headingUp && heading !== null) o.bearing = heading;
  lastCam = Date.now(); map.easeTo(o);
}
function maybeRotate() {
  if (!headingUp || !follow || heading === null) return;
  if (Date.now() - lastCam < 300) return;
  const d = Math.abs(((heading - map.getBearing()) % 360 + 540) % 360 - 180);
  if (d >= 3) cam();
}
// 向きをならす（急に振れないよう、少しずつ近づける）
function feedHeading(h, w) {
  const r = h * Math.PI / 180;
  hx = hx * (1 - w) + Math.cos(r) * w; hy = hy * (1 - w) + Math.sin(r) * w;
  heading = (Math.atan2(hy, hx) * 180 / Math.PI + 360) % 360;
  if (posMarker) { posMarker.setRotation(heading); arw.style.display = 'block'; }
  maybeRotate();
}
// スマホの方位センサー（コンパス）
window.addEventListener('deviceorientationabsolute', e => {
  if (e.alpha == null) return;
  const ang = (screen.orientation && screen.orientation.angle) || 0;
  lastCompass = Date.now();
  feedHeading((360 - e.alpha + ang) % 360, 0.15);
});
$('followBtn').onclick = () => setFollow(!follow);
$('headBtn').onclick = () => {
  headingUp = !headingUp;
  $('headBtn').textContent = headingUp ? '向き：進行方向' : '向き：北が上';
  if (headingUp) {
    if (heading === null) status('向きの情報を待っています（コンパス、または歩き出すと取得します）…');
    setFollow(true);
  } else map.easeTo({bearing: 0, duration: 500});
};

// ---------- 現在地 ----------
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(onPos, e => showErr('位置情報エラー：' + e.message),
    {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
} else showErr('この端末では位置情報が使えません');

function onPos(p) {
  const c = p.coords;
  pos = [c.longitude, c.latitude];
  if (!posMarker) {
    const el = document.createElement('div'); el.className = 'me';
    el.innerHTML = '<div class="arw"></div><div class="dot"></div>';
    arw = el.querySelector('.arw');
    posMarker = new mapboxgl.Marker({element: el, rotationAlignment: 'map'}).setLngLat(pos).addTo(map);
    if (heading !== null) { posMarker.setRotation(heading); arw.style.display = 'block'; }
    map.jumpTo({center: pos, zoom: 15});
    if (!dest) status('目的地を検索するか、「地図で指定」を押して地図をタップしてください。');
  } else posMarker.setLngLat(pos);
  // コンパスが使えないときは、GPSの進行方向で代用（ある程度の速さで歩いているときだけ）
  if (Date.now() - lastCompass > 3000 && c.heading != null && !isNaN(c.heading) && c.speed > 0.7) feedHeading(c.heading, 0.5);
  cam();
  updateRemain();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && 'geolocation' in navigator)
    navigator.geolocation.getCurrentPosition(onPos, () => {}, {enableHighAccuracy: true, maximumAge: 0, timeout: 15000});
});

// ---------- 検索（名称：OpenStreetMap／住所：Mapbox） ----------
$('searchBtn').onclick = doSearch;
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
async function doSearch() {
  const q = $('search').value.trim(); if (!q) return;
  $('hits').innerHTML = '<div class="small">検索中…</div>';
  const [a, b] = await Promise.all([searchOsm(q), searchMapbox(q)]);
  const all = a.concat(b);
  $('hits').innerHTML = '';
  all.forEach(h => {
    const d = document.createElement('div'); d.className = 'hit';
    d.innerHTML = `<b>${esc(h.name)}</b><br><span class="small">${esc(h.sub)}</span>`;
    d.onclick = () => { $('hits').innerHTML = ''; destName = h.name; setDest(h.p); };
    $('hits').appendChild(d);
  });
  if (!all.length) $('hits').innerHTML = '<div class="small">見つかりませんでした。別の言い方で試すか「地図で指定」を使ってください。</div>';
}
async function searchOsm(q) {
  try {
    let vb = '';
    if (pos) { const d = 0.3; vb = `&viewbox=${(pos[0] - d).toFixed(4)},${(pos[1] + d).toFixed(4)},${(pos[0] + d).toFixed(4)},${(pos[1] - d).toFixed(4)}`; }
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&countrycodes=jp&accept-language=ja&limit=5${vb}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return j.map(x => ({name: x.name || x.display_name.split(',')[0], sub: x.display_name, p: [Number(x.lon), Number(x.lat)]}));
  } catch (e) { showErr('名称検索エラー：' + e.message); return []; }
}
async function searchMapbox(q) {
  try {
    const prox = pos ? `&proximity=${pos[0]},${pos[1]}` : '';
    const j = await (await fetch(`https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(q)}&country=jp&language=ja&limit=5${prox}&access_token=${TOKEN}`)).json();
    return (j.features || []).map(f => ({name: f.properties.name || '', sub: f.properties.full_address || '', p: f.geometry.coordinates}));
  } catch (e) { showErr('住所検索エラー：' + e.message); return []; }
}

// ---------- 目的地・経由地 ----------
$('pickBtn').onclick = () => { pickMode = 'dest'; status('地図上の目的地をタップしてください。'); };
$('viaBtn').onclick = () => {
  if (!dest) { status('先に目的地を設定してください。'); return; }
  pickMode = 'via'; status('通りたい場所（経由地）をタップしてください。');
};
function clearVia() {
  via = null; if (viaMarker) { viaMarker.remove(); viaMarker = null; }
  $('viaClear').disabled = true;
}
function setDest(p) {
  dest = p; clearVia();
  if (destMarker) destMarker.remove();
  destMarker = new mapboxgl.Marker({color: '#c0392b'}).setLngLat(p).addTo(map);
  $('recalcBtn').disabled = false; $('favAdd').disabled = false;
  calc();
}
function setVia(p) {
  via = p;
  if (viaMarker) viaMarker.remove();
  viaMarker = new mapboxgl.Marker({color: '#555', scale: 0.8}).setLngLat(p).addTo(map);
  $('viaClear').disabled = false;
  calc();
}
$('viaClear').onclick = () => { clearVia(); calc(); };
$('recalcBtn').onclick = () => calc();
$('cmpChk').onchange = () => {
  if ($('cmpChk').checked) { if (route) fetchCmp(route.pts); }
  else { cmpCoords = null; cmpText = ''; setData('cmp', []); showSummary(); }
};
$('netChk').onchange = () => {
  if ($('netChk').checked && !graph) status('ルートを一度計算すると、その範囲の道が表示されます。');
  drawNet();
};

// ---------- お気に入り ----------
function saveFavs() {
  try { localStorage.setItem('walk_favs', JSON.stringify(favs)); } catch (e) { showErr('お気に入りの保存に失敗しました'); }
  renderFavs();
}
function renderFavs() {
  $('favBar').innerHTML = favs.map((f, i) => `<button class="fav" data-go="${i}">★${esc(f.name)}</button>`).join('');
  $('favBar').querySelectorAll('button').forEach(b => b.onclick = () => {
    const f = favs[Number(b.dataset.go)]; destName = f.name; $('hits').innerHTML = ''; setDest(f.p);
  });
  $('favList').innerHTML = favs.length
    ? favs.map((f, i) => `<div>${esc(f.name)}　<button data-del="${i}">削除</button></div>`).join('')
    : '<div class="small">まだ登録がありません</div>';
  $('favList').querySelectorAll('button').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.del);
    if (confirm(favs[i].name + 'を削除しますか？')) { favs.splice(i, 1); saveFavs(); }
  });
}
$('favAdd').onclick = () => {
  if (!dest) return;
  const name = prompt('お気に入りの名前', destName || '');
  if (name && name.trim()) { favs.push({name: name.trim(), p: dest}); saveFavs(); status(name.trim() + 'を登録しました。'); }
};
$('favExport').onclick = () => { $('favText').value = JSON.stringify(favs); };
$('favImport').onclick = () => {
  try {
    const a = JSON.parse($('favText').value);
    if (!Array.isArray(a)) throw 0;
    favs = a.filter(x => x && x.name && Array.isArray(x.p)); saveFavs();
    status('お気に入りを読み込みました。');
  } catch (e) { showErr('読み込めない形式です'); }
};
renderFavs();

// ---------- 道のデータ（OpenStreetMap） ----------
async function fetchOverpass(bb) {
  const box = [bb.s, bb.w, bb.n, bb.e].map(v => v.toFixed(5)).join(',');
  const q = `[out:json][timeout:90];way["highway"~"${HW}"](${box});out body;>;out skel qt;`;
  let last = null;
  for (const url of OVERPASS) {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 100000);
      const r = await fetch(url, {method:'POST', body:'data=' + encodeURIComponent(q),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal: ctl.signal});
      clearTimeout(tm);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return (await r.json()).elements || [];
    } catch (e) { last = e; }
  }
  throw new Error('道のデータを取得できませんでした（' + (last && last.name === 'AbortError' ? '時間切れ' : last.message) + '）');
}
function walkable(t) {
  t = t || {};
  const foot = t.foot || '', access = t.access || '';
  if (/^(no|private)$/.test(foot)) return false;
  if (/^(no|private)$/.test(access) && !/^(yes|designated|permissive)$/.test(foot)) return false;
  if (t.motorroad === 'yes') return false;
  return true;
}
function buildGraph(els) {
  const idx = new Map(), lon = [], lat = [], ways = [];
  els.forEach(e => { if (e.type === 'node') { idx.set(e.id, lon.length); lon.push(e.lon); lat.push(e.lat); } });
  const adj = lon.map(() => []);
  els.forEach(e => {
    if (e.type !== 'way' || !e.nodes) return;
    const n = e.nodes.map(id => idx.get(id)).filter(i => i !== undefined);
    if (n.length < 2) return;
    const ok = walkable(e.tags);
    ways.push({n, k: !ok ? 'ng' : (e.tags && e.tags.highway === 'steps' ? 'steps' : 'ok')});
    if (!ok) return;
    for (let i = 0; i < n.length - 1; i++) {
      const a = n[i], b = n[i + 1], w = distM([lon[a], lat[a]], [lon[b], lat[b]]);
      adj[a].push([b, w]); adj[b].push([a, w]);
    }
  });
  const comp = new Int32Array(lon.length).fill(-1);
  let cid = 0, main = -1, mainSize = 0;
  for (let s = 0; s < lon.length; s++) {
    if (comp[s] >= 0 || !adj[s].length) continue;
    let size = 0; const st = [s]; comp[s] = cid;
    while (st.length) {
      const v = st.pop(); size++;
      for (const [u] of adj[v]) if (comp[u] < 0) { comp[u] = cid; st.push(u); }
    }
    if (size > mainSize) { mainSize = size; main = cid; }
    cid++;
  }
  return {lon, lat, adj, comp, main, ways};
}
function drawNet() {
  if (!$('netChk').checked || !graph) { setData('net', []); return; }
  const g = graph, f = [];
  g.ways.forEach(w => {
    let k = w.k;
    if (k !== 'ng' && g.comp[w.n[0]] !== g.main) k = 'iso';
    f.push({type:'Feature', properties:{k}, geometry:{type:'LineString', coordinates: w.n.map(i => [g.lon[i], g.lat[i]])}});
  });
  setData('net', f);
}
function snap(g, p) {
  let bi = -1, bd = 1e12;
  for (let i = 0; i < g.lon.length; i++) {
    if (g.comp[i] !== g.main) continue;
    const d = distM(p, [g.lon[i], g.lat[i]]);
    if (d < bd) { bd = d; bi = i; }
  }
  return {i: bi, d: bd};
}

// ---------- 経路計算（A*法） ----------
class Heap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(k, v) {
    const a = this.a; a.push([k, v]); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last; let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top;
  }
}
function astar(g, s, t) {
  const n = g.lon.length, d = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), done = new Uint8Array(n);
  const tp = [g.lon[t], g.lat[t]], h = i => distM([g.lon[i], g.lat[i]], tp);
  const H = new Heap(); d[s] = 0; H.push(h(s), s);
  while (H.size) {
    const v = H.pop()[1];
    if (done[v]) continue; done[v] = 1;
    if (v === t) break;
    for (const [u, w] of g.adj[v]) {
      const nd = d[v] + w;
      if (nd < d[u]) { d[u] = nd; prev[u] = v; H.push(nd + h(u), u); }
    }
  }
  if (d[t] === Infinity) return null;
  const path = [];
  for (let v = t; v !== -1; v = prev[v]) path.push([g.lon[v], g.lat[v]]);
  return path.reverse();
}

// ---------- ルートを出す ----------
function clearRoute() { route = null; cmpCoords = null; cmpText = ''; setData('route', []); setData('cmp', []); $('sub').innerHTML = ''; }
async function calc() {
  if (busy) { pending = true; return; }
  if (!pos) { showErr('現在地がまだ取得できていません。少し待ってから「再計算」を押してください。'); return; }
  if (!dest) return;
  const from = pos.slice(), pts = [from].concat(via ? [via] : [], [dest]);
  const straight = distM(from, dest);
  if (straight > MAX_M) {
    clearRoute();
    $('rem').textContent = '徒歩の範囲を超えています';
    $('sub').textContent = `直線で${fmtDist(straight)}あります。降りる駅を目的地にしてください。`;
    return;
  }
  busy = true;
  try {
    if (!graph || !inside(bboxOf(pts, MARGIN), graph.bb)) {
      status('道のデータを取得中…（数秒〜数十秒かかります）'); await pause();
      const bb = bboxOf(pts, MARGIN + 500);
      const els = await fetchOverpass(bb);
      status('道の網を組み立て中…'); await pause();
      graph = buildGraph(els); graph.bb = bb;
      drawNet();
    }
    status('経路を計算中…'); await pause();
    const sn = pts.map(p => snap(graph, p));
    if (sn.some(s => s.i < 0)) throw new Error('近くに歩ける道が見つかりません');
    let path = [];
    for (let k = 0; k < sn.length - 1; k++) {
      const seg = astar(graph, sn[k].i, sn[k + 1].i);
      if (!seg) throw new Error('ルートが見つかりませんでした');
      path = path.concat(k ? seg.slice(1) : seg);
    }
    const coords = [from].concat(path, [dest]), cum = [0];
    for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + distM(coords[i - 1], coords[i]));
    route = {coords, cum, pts, off: 0};
    setData('route', line(coords));
    const b = new mapboxgl.LngLatBounds(); coords.forEach(c => b.extend(c));
    setFollow(false); map.fitBounds(b, {padding: 50, maxZoom: 17});
    cmpText = ''; cmpCoords = null; setData('cmp', []);
    updateRemain();
    if ($('cmpChk').checked) fetchCmp(pts);
    let msg = '計算完了 ' + new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'})
      + `（道の点 ${graph.lon.length.toLocaleString()}件）`;
    if (sn[0].d > 200) msg += `　※現在地から最寄りの道まで${fmtDist(sn[0].d)}あります`;
    status(msg);
  } catch (e) { showErr(e.message); status(''); }
  finally {
    busy = false;
    if (pending) { pending = false; calc(); }
  }
}

// ---------- 比較用：Mapboxの徒歩ルート ----------
async function fetchCmp(pts) {
  try {
    const c = pts.map(p => p[0].toFixed(6) + ',' + p[1].toFixed(6)).join(';');
    const res = await fetch(`https://api.mapbox.com/directions/v5/mapbox/walking/${c}?geometries=geojson&overview=full&access_token=${TOKEN}`);
    const j = await res.json();
    if (!res.ok || j.code !== 'Ok' || !j.routes.length) throw new Error(`HTTP ${res.status} ${j.code || ''} ${j.message || ''}`);
    const r = j.routes[0];
    cmpCoords = r.geometry.coordinates; setData('cmp', line(cmpCoords));
    cmpText = `比較（Mapbox徒歩・点線）：${fmtDist(r.distance)}・約${mins(r.distance)}分`;
  } catch (e) { showErr('比較ルートの取得に失敗：' + e.message); cmpText = ''; }
  showSummary();
}

// ---------- 残り距離の表示 ----------
function updateRemain() {
  if (!route) return;
  const total = route.cum[route.cum.length - 1];
  let remain = total;
  if (pos) {
    const n = nearest(route.coords, pos);
    const a = route.cum[n.i] + n.t * (route.cum[n.i + 1] - route.cum[n.i]);
    remain = Math.max(0, total - a); route.off = n.d;
  }
  $('rem').textContent = remain < 20 ? '目的地付近です' : `残り ${fmtDist(remain)}　約${mins(remain)}分`;
  showSummary();
}
function showSummary() {
  if (!route) return;
  const total = route.cum[route.cum.length - 1];
  let h = `全長 ${fmtDist(total)}・約${mins(total)}分（分速80m）${via ? '　経由地あり' : ''}`;
  if (cmpText) h += '<br>' + cmpText;
  if (route.off > 60) h += '<br><span style="color:#c0392b">ルートから離れています。必要なら「再計算」を押してください</span>';
  $('sub').innerHTML = h;
}
